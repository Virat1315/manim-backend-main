services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./CONTENT:/app/CONTENT
      - ./media:/app/media
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: celery -A gen_topic.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./CONTENT:/app/CONTENT
      - ./media:/app/media
    depends_on:
      - redis

volumes:
  redis_data:

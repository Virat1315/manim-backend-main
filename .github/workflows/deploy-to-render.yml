name: Deploy backend to Render (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy web + worker services to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          REPO: ${{ github.repository }}
          BRANCH: main
          OWNER_ID: tea-d8rq8b36sc1c73bk7msg
        run: |
          set -euo pipefail
          echo "Creating web service on Render (if not present)"
          WEB_RESPONSE=$(curl -sS -X POST "https://api.render.com/v1/services" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(cat <<JSON
{
  "name": "manim-backend-web",
  "ownerId": "${OWNER_ID}",
  "repository": "https://github.com/${REPO}",
  "branch": "${BRANCH}",
  "service": { "type": "web_service" },
  "buildCommand": "pip install -r requirements.txt",
  "startCommand": "gunicorn main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:\$PORT"
}
JSON
") )
          echo "Web response: $WEB_RESPONSE"

          echo "Creating background worker service on Render (if not present)"
          WORKER_RESPONSE=$(curl -sS -X POST "https://api.render.com/v1/services" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(cat <<JSON
{
  "name": "manim-backend-worker",
  "ownerId": "${OWNER_ID}",
  "repository": "https://github.com/${REPO}",
  "branch": "${BRANCH}",
  "service": { "type": "background" },
  "buildCommand": "pip install -r requirements.txt",
  "startCommand": "celery -A gen_topic.celery_app worker --loglevel=info"
}
JSON
") )
          echo "Worker response: $WORKER_RESPONSE"

          echo "Note: After services are created, set required environment variables (REDIS_URL, GEMINI, AWS/CLOUDINARY) in the Render dashboard or via the API."
